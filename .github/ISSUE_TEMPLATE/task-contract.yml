name: Task contract
description: Define a scoped engineering task and the evidence needed to accept it.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe outcomes, not implementation steps. Leave unknown tooling for the agent to discover.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change and why?
      placeholder: Export retries must not create duplicate rows.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: What is included, excluded, and must keep working?
      placeholder: |
        Included: export retry handling.
        Excluded: schema changes and UI redesign.
        Preserve: new exports still include every source record.
    validations:
      required: true
  - type: textarea
    id: acceptance-checks
    attributes:
      label: Acceptance checks
      description: What observable results mean done? Include any specific proof you need.
      placeholder: |
        Retries leave exactly one row per source record.
        New exports still contain every source record.
        Show before/after row counts.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and open questions
      description: Optional references, reproduction steps, or unresolved decisions.
      placeholder: |
        Reproduction: retry an export after a timeout.
        Open question: should retry identity expire?
    validations:
      required: false
